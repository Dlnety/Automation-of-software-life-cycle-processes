{% extends "base.html" %}{% block title %}Изменить учебный план — StudentProgress{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">Учебный план</div><h1>Изменить элемент</h1></div></div><section class="card narrow"><form method="post" class="form-stack">
<label>Специальность <span class="required">*</span><select name="specialty_id">{% for s in specialties %}<option value="{{ s.id }}" {% if s.id==item.specialty_id %}selected{% endif %}>{{ s.code }} — {{ s.name }}</option>{% endfor %}</select></label>
<label>Дисциплина <span class="required">*</span><select name="discipline_id">{% for d in disciplines %}<option value="{{ d.id }}" {% if d.id==item.discipline_id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label>
<label>Семестр <span class="required">*</span><input name="semester" type="number" min="1" max="12" value="{{ item.semester }}" required></label>
<label>Количество часов <span class="required">*</span><input name="hours" type="number" min="1" value="{{ item.hours }}" required></label>
<label>Форма отчётности <span class="required">*</span><select name="report_type">{% for x in report_types %}<option value="{{ x }}" {% if x==item.report_type %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label>
<div class="form-actions"><a class="button ghost" href="{{ url_for('curriculum') }}">Отмена</a><button class="button primary" type="submit">Сохранить</button></div></form></section>{% endblock %}
